[workspace]
resolver = "2"
members = [
    "crates/gpui_va",
    "crates/gpui_video",
    "crates/gpui_video_platform",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bite-gpui/gpui_video"
# The registries this workspace may be published to; `crates-io` is the default.
publish = ["crates-io"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"

[workspace.dependencies]
# This repo's own crates: a path for development, a version for release.
gpui_va = { version = "0.1.0", path = "crates/gpui_va" }
gpui_video = { version = "0.1.0", path = "crates/gpui_video" }
gpui_video_platform = { version = "0.1.0", path = "crates/gpui_video_platform" }

# The producer-side surface crate: a `gpui_va` decoder lands on the window renderer's GPU through
# it. Development takes it from the sibling checkout; on release it becomes its published version.
gpui_interop = { version = "0.1.0", path = "../gpui-interop/crates/gpui_interop" }

# The core, from the working tree next door — `bite-gpui`'s own checkout, so a fix in `gpui_wgpu`
# (the dma-buf importer) reaches this stack without a release. Each key keeps its source name, and
# the release preserves every `[lib] name` (`gpui`, `gpui_authoring`, `gpui_engine`, `gpui_wgpu`, …),
# so every `use gpui::…` in the crates and examples keeps compiling unchanged. On release each path is
# replaced by the core's published package — the `package = "bite-gp-…"` and `version = "1.23.301"`
# form this file carried before.
gpui = { path = "../bite-gpui/crates/gpui", default-features = false }
gpui_authoring = { path = "../bite-gpui/crates/gpui_authoring" }
gpui_engine = { path = "../bite-gpui/crates/gpui_engine" }
gpui_wgpu = { path = "../bite-gpui/crates/gpui_wgpu" }

# A layout engine to swap in for the bundled one, for the `grid` example's `morphorm` feature. It is
# published against the *published* core, so the example opts into it through an off-by-default
# feature rather than a working-tree build carrying it: see `[patch.crates-io]` below for why the
# two cannot meet.
gpui_morphorm = { package = "bite-gp-morphorm", version = "1.21" }

# Third-party, at the versions the core resolves to, so one graph holds one copy of each.
anyhow = "1.0.86"
flume = "0.12"
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }

# The renderer the `surface` example and its dma-buf test drive directly.
wgpu = "29.0.4"

# The `surface` example's other, non-Linux arms.
core-foundation = "0.10"
core-video = { version = "0.5.2", features = ["metal"] }
foreign-types = "0.5"
metal = "0.33"
pollster = "0.4.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

# `gpui_morphorm` is a *published* swap, built against the *published* core: its `gpui_engine`
# dependency is the crates.io `bite-gp-engine`, which a `[patch]` cannot redirect to the next-door
# `gpui_engine` because a patch matches by crates.io package name and the two differ. So the swap and
# a working-tree core cannot coexist in one graph, and the `grid` example's morphorm arm is behind the
# `gpui_video` crate's `morphorm` feature — off by default, so a working-tree build stays green. The
# core is also developed against a few forked crates, and patches only apply from the root workspace,
# so whichever repo builds it has to carry them.
[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
